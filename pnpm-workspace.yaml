  '@prisma/config>deepmerge-ts': 8.0.1
  'mysql2@>=3.0.0 <3.23.1': 3.23.1
  'phoenix@>=1.8.0 <1.8.9': 1.8.9
  '@ai-sdk/provider-utils@>=4.0.0 <4.0.33': 4.0.33
  '@opentelemetry/core@2.7.1': 2.8.0
  '@opentelemetry/resources@2.7.1': 2.8.0
  '@opentelemetry/sdk-trace-base@2.7.1': 2.8.0
  '@hono/node-server': 2.0.10
  '@tailwindcss/typography@0.5.19': 0.5.20
  'axios@1.17.0': 1.18.0
  'basehub>zod': 3.25.76
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'dompurify@>=3.4.8 <3.4.13': 3.4.13
  'esbuild@0.28.0': 0.28.1
  effect: 3.20.0
  fast-uri: 3.1.6
  form-data: 4.0.6
  hono: 4.13.5
  'js-yaml@3.14.2': 3.15.0
  'js-yaml@4.2.0': 4.3.0
  lodash: 4.18.1
  'mdx-bundler>uuid': 11.1.1
  parse5: ^7.2.1
  sharp: 0.35.4
  postcss: 8.5.23
  'typeid-js>uuid': 11.1.1
  'undici@^6.0.0': 6.28.0
  'undici@^7.0.0': 7.29.0
  valibot: 1.4.2
  'ws@^8.0.0': 8.21.0
peerDependencyRules:
  allowedVersions:
    '@tailwindcss/typography@0.5.20>tailwindcss': 4.3.0
allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  '@sentry/cli': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@clerk/backend@3.12.0'
  - '@clerk/shared@4.25.6'
  - '@clerk/testing@2.2.11'
